# =============================================
# SonarQube — PatitasSanas
# =============================================

sonar.projectKey=patitassanas
sonar.projectName=PatitasSanas - Sistema Veterinario
sonar.projectVersion=1.0

# ----- Fuentes -----
sonar.sources=Backend/app,Frontend/src
sonar.tests=Backend/tests

# ----- Python (Backend) -----
sonar.python.version=3.11
sonar.python.coverage.reportPaths=Backend/coverage.xml

# ----- JavaScript/React (Frontend) -----
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.javascript.file.suffixes=.js,.jsx

# ----- Exclusiones -----
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/alembic/versions/**,\
  **/*.min.js,\
  **/assets/**

sonar.coverage.exclusions=\
  **/migrations/**,\
  **/alembic/**,\
  **/config/**,\
  Frontend/src/main.jsx

# ----- Duplicaciones: ignorar seeds y esquemas SQL -----
sonar.cpd.exclusions=**/*.sql

# ----- Codificación -----
sonar.sourceEncoding=UTF-8

# ----- Servidor SonarQube (local) -----
# Cambiar por la URL del servidor si es remoto
sonar.host.url=http://localhost:9000

# Token generado en SonarQube > My Account > Security
# Pasar por variable de entorno al ejecutar el scanner:
#   sonar-scanner -Dsonar.token=$env:SONAR_TOKEN
